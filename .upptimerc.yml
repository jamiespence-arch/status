owner: jamiespence-arch
repo: status

# Checked from GitHub's machines every 5 minutes, i.e. from outside the house.
# Port 25 is deliberately absent: GitHub's runners run on Azure, which blocks
# outgoing port-25 connections, so it would read as down. The server's
# own healthcheck.sh covers 25 with a real SMTP conversation every hour.
sites:
  - name: Website
    url: https://craftywebsite.com
  - name: Email (reading)
    check: "tcp-ping"
    url: mail.craftywebsite.com
    port: 993
  - name: Email (sending)
    check: "tcp-ping"
    url: mail.craftywebsite.com
    port: 587

# Outages open a GitHub issue, but it is created with Jamie's own token, so
# GitHub never notifies him about it. The real alert is the ntfy.sh push set in
# the NOTIFICATION_CUSTOM_WEBHOOK(_URL) secrets - proven end to end 11 Sep 2026.
assignees:
  - jamiespence-arch

status-website:
  cname: status.craftywebsite.com
  name: Crafty Website status
  introTitle: "Is Crafty Website working?"
  introMessage: "This page checks our websites and email from outside every few minutes."
  navbar:
    - title: Status
      href: /
